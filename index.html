<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Break Muna</title>
<meta name="description" content="A five minute break in an office pantry. Then the door closes for thirty.">
<meta name="theme-color" content="#1f1a24">
<meta property="og:type" content="website">
<meta property="og:title" content="Break Muna">
<meta property="og:description" content="A five minute break in an office pantry. Then the door closes for thirty.">
<!-- Link preview image. LinkedIn wants a full address here: prefix the domain once it is chosen. -->
<meta property="og:image" content="assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="css/pantry.css">
</head>
<body>
<main class="pantry">
  <div class="door" id="door">
    <img class="room-art" src="assets/sprites/door.png" width="90" height="130" alt="The pantry door.">
    <div class="door-glow" aria-hidden="true"></div>
    <img class="sign" id="sign" src="assets/sprites/sign.png" width="29" height="17" alt="Closed" hidden>
    <button type="button" class="door-btn" id="door-btn" aria-label="Pantry door. Tap to start a five minute break."></button>
    <button type="button" class="ctl last-receipt" id="last-receipt" hidden>Last receipt</button>
  </div>

  <div class="room" id="room" hidden>
    <img class="room-art" src="assets/sprites/room.png" width="90" height="130" alt="A small office pantry drawn in pixel art.">

    <canvas class="fx" id="fx" width="90" height="130" aria-hidden="true"></canvas>
    <canvas class="hands" id="hands" width="17" height="17" aria-hidden="true"></canvas>

    <!-- Stations. Each button is placed over its object in css/pantry.css. -->
    <button type="button" class="spot station" data-spot="dispenser" data-cursor="spoon" aria-label="Water dispenser"></button>
    <button type="button" class="spot station" data-spot="sachet" data-cursor="spoon" aria-label="3-in-1 coffee sachets"></button>
    <button type="button" class="spot station" data-spot="mug" data-cursor="spoon" aria-label="Mug"></button>
    <button type="button" class="spot station" data-spot="merienda" data-cursor="fork" aria-label="Merienda tray"></button>
    <button type="button" class="spot station" data-spot="parcel" data-cursor="finger" aria-label="Parcel pile"></button>
    <button type="button" class="spot station" data-spot="window" data-cursor="eyes" aria-label="The window"></button>
    <button type="button" class="spot detail" data-spot="plant" aria-label="The plant on the windowsill"></button>

    <!-- Cabinets under the counter, and the building cat. -->
    <button type="button" class="spot detail" data-spot="cab1" aria-label="First cabinet"></button>
    <button type="button" class="spot detail" data-spot="cab2" aria-label="Second cabinet"></button>
    <button type="button" class="spot detail" data-spot="cab3" aria-label="Third cabinet"></button>
    <button type="button" class="spot detail" data-spot="cab4" aria-label="Supply cabinet"></button>
    <button type="button" class="spot detail" data-spot="cat" aria-label="The building cat"></button>

    <!-- Background details, one line each. -->
    <button type="button" class="spot detail" data-spot="microwave" aria-label="Microwave"></button>
    <button type="button" class="spot detail" data-spot="ref" aria-label="Ref"></button>
    <button type="button" class="spot detail" data-spot="refdoor" aria-label="Ref door: magnets and a sticky note"></button>
    <button type="button" class="spot detail" data-spot="aircon" aria-label="Aircon remote"></button>
    <button type="button" class="spot detail" data-spot="unit" aria-label="Aircon"></button>
    <button type="button" class="spot detail" data-spot="bulletin" aria-label="Bulletin board"></button>
    <button type="button" class="spot detail" data-spot="clock" aria-label="Wall clock"></button>

    <div class="lights" aria-hidden="true"></div>
    <div class="panel" id="wrap" role="group" aria-label="Bubble wrap" hidden>
      <button type="button" class="ctl panel-close" id="wrap-close" aria-label="Put the parcel down">&#x2715;</button>
      <div class="wrap-grid" id="wrap-grid"></div>
    </div>

    <div class="panel" id="mini" role="group" hidden>
      <button type="button" class="ctl panel-close" id="mini-close" aria-label="Close">&#x2715;</button>
      <div class="mini-body" id="mini-body"></div>
    </div>

    <div class="controls">
      <button type="button" class="ctl icon" id="exit" aria-label="Balik na ako. End the break and print the receipt." title="Balik na ako">
        <img src="assets/sprites/exit.png" width="32" height="32" alt="">
      </button>
      <button type="button" class="ctl icon" id="sound" aria-label="Sound" aria-pressed="false" title="Sound">
        <img src="assets/sprites/sound_off.png" width="32" height="32" alt="">
      </button>
    </div>
  </div>

  <div class="dialog" id="dialog" role="status" aria-live="polite" hidden></div>
</main>

<div class="receipt" id="receipt" role="dialog" aria-modal="true" aria-label="Break receipt" hidden>
  <div class="slip">
    <img id="receipt-img" width="1080" height="1350" alt="">
    <pre class="sr-only" id="receipt-text"></pre>
    <div class="receipt-actions">
      <button type="button" class="ctl" id="receipt-share">Save image</button>
      <button type="button" class="ctl" id="receipt-caption">Copy caption</button>
      <button type="button" class="ctl" id="receipt-close">Close</button>
    </div>
    <p class="receipt-hint" id="receipt-hint" hidden>Or press and hold the receipt to save it.</p>
  </div>
</div>

<script src="js/scale.js"></script>
<script src="data/copy.js"></script>
<script src="js/conditions.js"></script>
<script src="js/receipt.js"></script>
<script src="js/break.js"></script>
<script src="js/sound.js"></script>
<script src="js/toys.js"></script>
<script src="js/room.js"></script>
</body>
</html>
